# ═══════════════════════════════════════════════════════════════════
# ค่าเพิ่มเติมของ cluster vec-sms (PostgreSQL 18 · พอร์ต 5434)
# install.sh คัดลอกไปที่ /etc/postgresql/18/vecsms/conf.d/vecsms.conf
#
# cluster แยกจากของ examkub ทั้ง data directory · superuser · หน่วยความจำ
# คำสั่งหนักของ vec-sms จึงไม่กิน shared_buffers หรือ connection ของระบบสอบ
# ═══════════════════════════════════════════════════════════════════

port = 5434
listen_addresses = '127.0.0.1'
timezone = 'Asia/Bangkok'

# เล็กโดยตั้งใจ — แอปใช้ pool 10 ตัว เผื่อ psql กับงานสำรองข้อมูล
max_connections = 30
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# คำสั่งค้างไม่ควรกินเครื่องนานเกินไป — ชั้น API ตั้ง statement_timeout ของตัวเองอยู่แล้ว
idle_in_transaction_session_timeout = 60s

log_min_duration_statement = 1000
