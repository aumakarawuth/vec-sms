# ═══════════════════════════════════════════════════════════════════
# /etc/nginx/sites-available/vec.examkub.com
#
# เป็นไฟล์ใหม่ของตัวเอง ไม่แก้ server block ของ examkub เลยสักบรรทัด —
# ถ้าไฟล์นี้ผิด `nginx -t` จะล้มก่อน reload และ examkub ยังทำงานตามเดิม
#
# ─── เข้าทาง Cloudflare Tunnel เท่านั้น ───
# Public Hostname vec.examkub.com → http://localhost:8081
# ไม่มีใบรับรองที่นี่ เพราะ Cloudflare ปิดปลาย HTTPS ให้แล้ว
#
# ฟังแค่ 127.0.0.1 ที่พอร์ตของตัวเอง ด้วยเหตุผลสองข้อ
# · ไม่ไปปนกับ server block บนพอร์ต 80 ของ examkub เลย
# · CF-Connecting-IP เชื่อได้ก็ต่อเมื่อทุกคำขอมาจาก cloudflared จริง —
#   ถ้าพอร์ตนี้เปิดสู่ภายนอก ใครก็ปลอมเฮดเดอร์นี้มาแล้วข้ามตัวจำกัดคำขอได้
# ═══════════════════════════════════════════════════════════════════

# cloudflared ต่อมาจาก 127.0.0.1 ทุกคำขอ — ถ้าใช้ $remote_addr ทั้งวิทยาลัย
# จะแชร์ถังจำกัดคำขอใบเดียว และ access_log.ip_hash เป็นค่าเดียวทุกแถว
map $http_cf_connecting_ip $vecsms_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# จำกัดคำขอชั้นนอกสุดก่อนถึง Node — กันการยิงรัวกินทรัพยากรที่ใช้ร่วมกับระบบสอบ
# (ตัวจำกัดใน API ยังทำงานอยู่ อันนี้เป็นชั้นที่ถูกกว่า)
limit_req_zone $vecsms_client_ip zone=vecsms_api:10m rate=20r/s;

upstream vecsms_api {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 127.0.0.1:8081;
    server_name vec.examkub.com;

    # หน้าจอเจ้าหน้าที่ (web/dist) เป็นไฟล์นิ่ง
    root /opt/vecsms/www;
    index index.html;

    # นำเข้าข้อมูลใช้ได้ถึง 8 MB (IMPORT_BODY_LIMIT) — ค่าเริ่มต้นของ Nginx คือ 1 MB
    client_max_body_size 10m;

    location /api/ {
        limit_req zone=vecsms_api burst=40 nodelay;
        proxy_pass http://vecsms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # ต้องเขียนทับ ไม่ใช่ต่อท้าย — ไม่เช่นนั้นผู้ใช้ปลอมเฮดเดอร์มาเองได้
        # แล้วข้ามตัวจำกัดคำขอ (TRUST_PROXY=true เชื่อค่านี้)
        proxy_set_header X-Forwarded-For $vecsms_client_ip;
        # ผู้ใช้เข้ามาด้วย HTTPS เสมอ (Cloudflare) แม้ขาจาก cloudflared ถึงนี่เป็น http
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # router ของหน้าจอเป็นแบบ hash จึงไม่ต้อง fallback ทุกเส้นทางไป index.html
    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
