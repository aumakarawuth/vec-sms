# ═══════════════════════════════════════════════════════════════════
# Render Blueprint — ระบบบริหารวิทยาลัยอาชีวศึกษาเอกชน
#
# วิธีใช้
#   1. push โปรเจกต์ขึ้น GitHub
#   2. Render → New → Blueprint → เลือกรีโป
#   3. Render อ่านไฟล์นี้แล้วสร้างฐานข้อมูลกับ service ให้เอง
#   4. ทำขั้นตอนใน DEPLOY-ONLINE.md ให้ครบ — โดยเฉพาะการสร้างผู้ใช้
#      ฐานข้อมูลที่ไม่ใช่ superuser ซึ่ง **ข้ามไม่ได้**
#
# ─── เรื่องที่ต้องรู้ก่อน ───
# ผู้ใช้ที่ Render ให้มาตอนสร้างฐานข้อมูลเป็นเจ้าของฐานข้อมูล
# แอปจะ **ปฏิเสธการเริ่มทำงาน** ถ้าตรวจพบว่าผู้ใช้ข้าม RLS ได้
# ซึ่งเป็นพฤติกรรมที่ตั้งใจ ไม่ใช่บั๊ก — ต้องสร้าง vecsms_app แยกก่อน
# ═══════════════════════════════════════════════════════════════════

databases:
  - name: vecsms-db
    databaseName: vecsms
    user: vecsms_owner
    plan: basic-256mb          # ปรับตามขนาดจริง — ดู DEPLOY-ONLINE.md
    # ต้องเป็น 18 ไม่ใช่ 16 — วัดแล้วบน 16 ตัวจัดตารางอัตโนมัติใช้เวลา
    # 14.6 วินาทีจนชน statement_timeout ส่วนบน 18 ใช้ 90 มิลลิวินาที
    # ด้วยข้อมูลชุดเดียวกัน (ดูข้อ 12 ในรายการที่เคยพังแบบเงียบ ๆ)
    postgresMajorVersion: "18"

services:
  - type: web
    name: vecsms-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore          # ใกล้ไทยที่สุดที่ Render มี — หน่วงต่ำกว่า US มาก
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      # ตั้งด้วยมือใน Dashboard เป็นค่าของ vecsms_app ที่สร้างเอง
      # ไม่ผูกกับ connectionString ของ Render เพราะนั่นคือผู้ใช้เจ้าของฐานข้อมูล
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      # ─── ตั้งด้วยมือ ห้ามใช้ generateValue ───
      # production-guard บังคับว่าต้องถอด base64 ได้ **32 ไบต์พอดี**
      # ค่าที่ Render สุ่มให้เป็นสตริงสุ่มธรรมดา ถอดแล้วไม่ได้ 32 ไบต์
      # แอปจึงไม่บูตเหมือนกับตอนไม่ได้ตั้งเลย
      #   openssl rand -base64 32
      - key: MFA_SECRET_KEY
        sync: false
      # ─── ตั้งด้วยมือ และ **ห้ามทำหาย** ───
      # เข้ารหัสเลขประจำตัวประชาชน ซึ่งใบ รบ. พิมพ์เต็มบนกระดาษทุกรูปแบบ
      # ถ้าไม่มี วิทยาลัยกรอกเลขบัตรไม่ได้เลยสักคน และใบ รบ. ทุกใบจะมี
      # ช่องเลขบัตรว่าง — ใช้ยื่นจริงไม่ได้
      #
      # กุญแจใบนี้ถอดใบ รบ. ที่ออกไปแล้วทั้งหมด ทำหายแปลว่าพิมพ์ซ้ำแล้ว
      # ช่องเลขบัตรว่างตลอดไป **ต้องสำรองไว้นอกระบบ deploy**
      #   openssl rand -base64 32
      - key: NATIONAL_ID_KEY
        sync: false
      # กุญแจเก่าหลังหมุนกุญแจ — คั่นด้วยจุลภาค เว้นว่างได้ถ้ายังไม่เคยหมุน
      # ใบที่ออกด้วยกุญแจเก่ายังพิมพ์ซ้ำได้ตราบที่ยังอยู่ในรายการนี้
      - key: NATIONAL_ID_KEYS_OLD
        sync: false
      # ─── ตั้งด้วยมือเช่นกัน ───
      # เปิดสองอย่างที่อยู่นอกขอบเขตของทุกบทบาท — เปิดวิทยาลัยใหม่ (0037)
      # และสร้างบัญชีผู้ให้บริการคนแรก (0040) ถ้าไม่ประกาศไว้ที่นี่
      # ทั้งสองเส้นทางจะปิดสนิท (503) หลัง deploy โดยที่ health ยังเขียว
      # แล้วขั้นตอนที่ 7 ของคู่มือทำไม่ได้เลยสักข้อ
      #   openssl rand -base64 48
      - key: PROVISION_KEY
        sync: false
      - key: JWT_TTL
        value: 12h
      - key: DEV_AUTH
        value: "false"         # เปิดในระบบจริงไม่ได้เด็ดขาด — ออก token ได้โดยไม่ต้องยืนยันตัวตน
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: Asia/Bangkok
      - key: DB_POOL_MAX
        value: "10"
      # Render วาง service ไว้หลัง proxy ของตัวเองเสมอ ไอพีที่ socket เห็น
      # จึงเป็นของ proxy เหมือนกันทุกคำขอ ถ้าไม่เชื่อ X-Forwarded-For ผลคือ
      # ทั้งวิทยาลัยแชร์ถังจำกัดคำขอใบเดียว (429 กันทั้งวิทยาลัยช่วงประกาศผล
      # โดยไม่มีใครโจมตี) และ access_log.ip_hash เป็นค่าเดียวกันทุกแถว
      # ซึ่งทำให้หลักฐานที่เก็บไว้ 90 วันตาม พ.ร.บ.คอมพิวเตอร์ ม.26 ชี้อะไรไม่ได้
      #
      # ตั้งเป็น true ได้เพราะอยู่หลัง proxy จริง — บน VPS ที่ไม่มี proxy
      # ห้ามตั้ง เพราะใครก็ปลอมเฮดเดอร์เพื่อขอโควตาใหม่ทุกคำขอได้
      - key: TRUST_PROXY
        value: "true"
      # ตัวตั้งเวลาในโปรเซส — ใช้ได้เฉพาะเมื่อรัน **instance เดียว** เท่านั้น
      # ถ้า scale เกินหนึ่ง งานประจำคืนจะถูกรันซ้ำพร้อมกันทุก instance
      # (ซ้ำจริงที่เจ็บที่สุดคือ usage-snapshot ซึ่งเป็นหลักฐานการเรียกเก็บเงิน)
      #
      # ทางเลือกอีกทางคือปิดตัวนี้แล้วให้ cron ยิง POST /jobs/run เข้ามา
      # ซึ่ง **ยังทำไม่ได้จริงตอนนี้** — ดูหัวข้อ "งานตามกำหนดเวลา" ท้ายไฟล์
      - key: JOBS_ENABLED
        value: "true"
      - key: LOGIN_LOG_KEEP_DAYS
        value: "90"
      # โดเมนของ Flutter build web — ใส่เป็นรายชื่อ ห้ามใช้ '*'
      - key: CORS_ORIGINS
        sync: false

# ═══════════════════════════════════════════════════════════════════
# งานตามกำหนดเวลา — ทำไมไม่มี cron service ในไฟล์นี้
#
# เคยมี cron ที่ยิง POST /jobs/run พร้อม `JOBS_TOKEN` ตามที่คู่มือบอก
# แต่ token แบบนั้นออกไม่ได้จริงเลยสักวิธี ด้วยเหตุผลสองชั้นที่ไม่เกี่ยวกัน
#
#   1. JobsController บังคับ @Roles('admin','director') และ auth_policy
#      ตั้ง require_mfa_roles = {admin,director} เป็นค่าเริ่มต้น (0036)
#      POST /auth/login ของบัญชีนั้นจึงคืน challengeToken ไม่ใช่ token จริง
#      cron ยิงต่อไม่ได้ถ้าไม่มีคนกดรหัสจากแอป authenticator ให้
#   2. ต่อให้ผ่าน MFA มาได้ access_token_minutes ค่าเริ่มต้นคือ 30 นาที
#      (0014) ค่าที่แปะไว้ใน env ของ cron จึงตายก่อนถึงตี 1:30 ของคืนแรก
#
# ผลที่เคยเป็นคือ cron ล้มทุกคืนเงียบ ๆ โดยงานประจำวันไม่เคยรันเลยสักครั้ง
# ซึ่งแปลว่าไม่มีใครถูกระงับสิทธิ์เพราะค้างชำระ คะแนนความเสี่ยงค้างทั้งภาค
# และ usage_snapshot ว่างเปล่าจนออกใบเรียกเก็บไม่ได้ — ทั้งหมดโดยไม่มีอะไรฟ้อง
# (เรื่องเดียวกับข้อ 8 ในรายการที่เคยพังแบบเงียบ ๆ)
#
# ตอนนี้จึงใช้ตัวตั้งเวลาในโปรเซสแทน (JOBS_ENABLED=true ข้างบน) ซึ่งไม่ต้อง
# มี token เลย แลกกับข้อจำกัดว่า **ห้าม scale เกินหนึ่ง instance**
#
# ถ้าวันหนึ่งต้องรันหลาย instance จริง ต้องเพิ่มกลไก token ระดับบริการใน
# โค้ดก่อน แล้วค่อยเอา cron กลับมา — และตอนนั้นอย่าลืมว่า
# `fromService property: hostport` คืน host:port เปล่า ๆ ไม่มี scheme
# ซึ่ง fetch() รับไม่ได้ ต้องเติม http:// ให้เอง (ของเดิมก็ผิดข้อนี้ด้วย)
# ═══════════════════════════════════════════════════════════════════
