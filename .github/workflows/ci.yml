# ═══════════════════════════════════════════════════════════════════
# CI — รันเทสต์ทั้งฐานข้อมูลและ API กับ PostgreSQL จริง
#
# ไม่ mock ฐานข้อมูลเลย เพราะกฎทางธุรกิจเกือบทั้งหมดของระบบนี้อยู่ใน
# ฐานข้อมูล — RLS, constraint, trigger และ function ถ้า mock จะเหลือ
# แต่การทดสอบชั้นที่บางที่สุดซึ่งไม่ใช่ที่ที่บั๊กอยู่
# ═══════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # ต้องตรงกับรุ่นที่พัฒนาและ deploy จริง (PostgreSQL 18) —
        # เดิมเป็น 16 ซึ่งแปลว่า CI ตรวจสิ่งที่ไม่มีใครรัน และสิ่งที่ทุกคนรัน
        # ไม่มีใครตรวจ ตอนที่ API-72 หมดเวลาที่ 15 วินาทีบน CI คำสั่งเดียวกัน
        # บนเครื่องพัฒนาใช้เวลา 40 มิลลิวินาที ด้วยข้อมูลชุดเดียวกันและสถิติ
        # ของตัววางแผนที่ว่างเปล่าเหมือนกัน — ต่างกันแค่รุ่นของฐานข้อมูล
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
          TZ: Asia/Bangkok
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
      PGCLIENTENCODING: UTF8
      TZ: Asia/Bangkok

    steps:
      - uses: actions/checkout@v4

      # ไม่ระบุเลขรุ่น — ubuntu-latest ขยับเป็น 26.04 แล้วไม่มี postgresql-client-16
      # ให้ติดตั้ง job ล้มตั้งแต่ขั้นนี้ทั้งที่โค้ดไม่ได้เปลี่ยน ตัวเมตาแพ็กเกจได้รุ่น
      # ตั้งต้นของระบบปฏิบัติการ ซึ่ง psql รุ่นใหม่กว่าต่อเซิร์ฟเวอร์ 18 ได้เสมอ
      - name: ติดตั้ง psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: เทสต์ฐานข้อมูล — migrations, seed และเทสต์ทั้งหมด
        run: bash db/run.sh

      - name: ตรวจว่าไฟล์ใน dist ตรงกับ migrations
        run: |
          bash db/build.sh
          if ! git diff --quiet -- db/dist; then
            echo "::error::db/dist ไม่ตรงกับ migrations — รัน bash db/build.sh แล้ว commit ด้วย"
            git diff --stat -- db/dist
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: ติดตั้ง dependencies
        working-directory: api
        run: npm ci

      - name: เตรียมฐานข้อมูลสำหรับเทสต์ API
        run: bash api/test/prepare-db.sh

      # ต้องมี PROVISION_KEY ด้วย — API-82/83 ยิงเส้นทางผูกแพ็กเกจของ
      # ผู้ให้บริการ ซึ่งปิดสนิท (503) เมื่อไม่ได้ตั้งกุญแจ
      - name: เทสต์ระบบงาน
        working-directory: api
        env:
          DATABASE_URL: postgres://apiuser:apipass@localhost:5432/vecsms_api_test
          ADMIN_DATABASE_URL: postgres://postgres:ci@localhost:5432/vecsms_api_test
          JWT_SECRET: ci-secret
          IP_HASH_SECRET: ci-ip-salt
          DEV_AUTH: "true"
          JOBS_ENABLED: "false"
          PROVISION_KEY: ci-provision-key
          # API-167/168/169 กรอกเลขบัตรจริงแล้วพิมพ์ใบ รบ. — ถ้าไม่มีกุญแจ
          # ชั้น API จะปฏิเสธการเก็บเลขบัตรโดยตั้งใจ แล้วทั้งสามข้อล้ม
          # (ค่าใน CI เป็นค่าคงที่ได้ เพราะไม่มีข้อมูลจริงในฐานทดสอบ)
          NATIONAL_ID_KEY: Y2ktbmF0aW9uYWwtaWQta2V5LTMyLWJ5dGVzLWxvbmc=
        run: npm run test:e2e

      - name: เทสต์การยืนยันตัวตน
        working-directory: api
        env:
          DATABASE_URL: postgres://apiuser:apipass@localhost:5432/vecsms_api_test
          ADMIN_DATABASE_URL: postgres://postgres:ci@localhost:5432/vecsms_api_test
          JWT_SECRET: ci-secret
          IP_HASH_SECRET: ci-ip-salt
          DEV_AUTH: "true"
          JOBS_ENABLED: "false"
        run: |
          bash test/prepare-db.sh
          npm run test:auth

      - name: เทสต์การจำกัดจำนวนคำขอ
        working-directory: api
        env:
          DATABASE_URL: postgres://apiuser:apipass@localhost:5432/vecsms_api_test
          ADMIN_DATABASE_URL: postgres://postgres:ci@localhost:5432/vecsms_api_test
          JWT_SECRET: ci-secret
          IP_HASH_SECRET: ci-ip-salt
          DEV_AUTH: "true"
          JOBS_ENABLED: "false"
        run: |
          bash test/prepare-db.sh
          npm run test:ratelimit

      - name: เทสต์มาตรการสำหรับระบบจริง
        working-directory: api
        env:
          DATABASE_URL: postgres://apiuser:apipass@localhost:5432/vecsms_api_test
          ADMIN_DATABASE_URL: postgres://postgres:ci@localhost:5432/vecsms_api_test
          JWT_SECRET: ci-secret
          IP_HASH_SECRET: ci-ip-salt
          DEV_AUTH: "true"
          JOBS_ENABLED: "false"
          PROVISION_KEY: ci-provision-key
        run: |
          bash test/prepare-db.sh
          npm run test:hardening

      # ชุดนี้คุมกำแพงระหว่างผู้ให้บริการกับวิทยาลัย ซึ่งเป็นจุดเดียวในระบบ
      # ที่ตั้งใจให้เห็นทุกวิทยาลัยพร้อมกัน — ถ้าพังคือข้อมูลของทุกลูกค้า
      # หลุดจากบัญชีเดียว จึงต้องอยู่ใน CI ไม่ใช่รันเฉพาะตอนนึกได้
      - name: เทสต์หน้าจอผู้ดูแลข้ามวิทยาลัย
        working-directory: api
        env:
          DATABASE_URL: postgres://apiuser:apipass@localhost:5432/vecsms_api_test
          ADMIN_DATABASE_URL: postgres://postgres:ci@localhost:5432/vecsms_api_test
          JWT_SECRET: ci-secret
          IP_HASH_SECRET: ci-ip-salt
          DEV_AUTH: "true"
          JOBS_ENABLED: "false"
          PROVISION_KEY: ci-provision-key
        run: |
          bash test/prepare-db.sh
          npm run test:platform

      # ตัวจำกัดจำนวนคำขอมีไว้กันการโจมตี การปล่อยให้ dependency
      # ที่มีช่องโหว่ระดับสูงหลุดเข้ามาพร้อมกันจึงขัดกันเอง
      - name: ตรวจช่องโหว่ของ dependency
        working-directory: api
        run: npm audit --audit-level=high

      - name: ตรวจว่า image build ได้
        run: docker build -t vecsms-api -f api/Dockerfile .

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - name: ติดตั้ง dependencies
        working-directory: app
        run: flutter pub get

      # ใช้ dart analyze ไม่ใช่ flutter analyze เพราะ flutter analyze
      # ไล่อ่านไดเรกทอรีของ SDK ด้วย ซึ่งช้าและไม่จำเป็น
      - name: ตรวจโค้ด
        working-directory: app
        run: dart analyze .

      - name: เทสต์
        working-directory: app
        run: flutter test

      - name: ตรวจว่า build web ได้
        working-directory: app
        run: flutter build web --release

      # entrypoint ที่สองไม่ได้ถูกแตะโดย build ข้างบนเลย ถ้าไม่ตรวจแยก
      # หน้าจอผู้ให้บริการจะ build ไม่ผ่านโดยไม่มีใครรู้จนถึงวัน deploy
      - name: ตรวจว่า build หน้าจอผู้ให้บริการได้
        working-directory: app
        run: flutter build web --release -t lib/main_platform.dart --output build/platform

  # หน้าจอเจ้าหน้าที่ — คนละบันเดิลกับแอป Flutter และคนละเทคโนโลยี
  # ถ้าไม่ตรวจแยก การแก้ชนิดข้อมูลฝั่ง API จะทำให้เว็บ build ไม่ผ่าน
  # โดยไม่มีใครรู้จนถึงวัน deploy (เหตุผลเดียวกับ entrypoint ที่สองของ Flutter)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: ติดตั้ง dependencies
        working-directory: web
        run: npm ci

      # `npm run build` เรียก `tsc -b` ให้อยู่แล้ว จึงเป็นทั้งการตรวจชนิดข้อมูล
      # และการยืนยันว่า bundle ออกมาได้จริง
      - name: ตรวจชนิดข้อมูลและ build
        working-directory: web
        run: npm run build

      - name: ตรวจว่า dependency ตอนรันยังมีแค่ react กับ react-dom
        working-directory: web
        run: |
          # ชั้นนี้ตั้งใจให้พึ่งไลบรารีน้อยที่สุด (ดู CLAUDE.md) การเพิ่ม
          # router/state library/UI kit เข้ามาต้องเป็นการตัดสินใจที่ตั้งใจ
          # ไม่ใช่สิ่งที่ไหลเข้ามาเงียบ ๆ ผ่าน PR ที่ไม่มีใครดู package.json
          deps=$(node -p "Object.keys(require('./package.json').dependencies).sort().join(',')")
          if [ "$deps" != "react,react-dom" ]; then
            echo "dependency ตอนรันเปลี่ยนไปเป็น: $deps"
            echo "ถ้าตั้งใจเพิ่มจริง ให้แก้เงื่อนไขนี้พร้อมเขียนเหตุผลใน CLAUDE.md"
            exit 1
          fi
